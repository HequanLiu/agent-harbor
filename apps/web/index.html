<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/harbor.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AgentHarbor · 智港</title>
		<script>
			// Applied before the first paint, so the theme never flashes.
			let theme = 'light';
			try {
				if (localStorage.getItem('harbor-theme') === 'dark') theme = 'dark';
			} catch {
				// Storage can be unavailable; keep the default light theme.
			}
			document.documentElement.classList.add(theme);
			document.documentElement.style.colorScheme = theme;
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
